---
name: Build docker image

on:
  push:
    tags:
      - "v*"
    branches:
      - "develop"
      - "release/v*"
      - "feature/*"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-24.04

    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        go-version: [1.26.x]

    outputs:
      tags: ${{ steps.meta.outputs.tags }}

    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Get repo name
        id: extract_repo_name
        shell: bash
        run: |
          echo "REPO_NAME=$(basename ${{ github.repository }})" >> $GITHUB_ENV

      # Release and moving tags (and labels), promoted by the scan gate once the image is clean
      - name: Generate docker tags/labels from github build context
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=tag
            type=sha,prefix=,enable=true
            type=raw,enable=${{ github.ref == 'refs/heads/develop' }},value=develop
          flavor: |
            latest=${{ startsWith(github.ref, 'refs/tags/') }}

      # The immutable commit tag only, it is the one pushed by the build and scanned by the gate
      - name: Generate immutable commit tag
        id: sha
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: type=sha,prefix=
          flavor: latest=false

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          file: ./Dockerfile
          push: true
          # Only the commit tag is pushed here, the other tags are promoted by the gate after a clean scan
          tags: ${{ steps.sha.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Scan the image
        uses: streamingfast/actions/image-scan/gate@v1
        with:
          image: ${{ steps.sha.outputs.tags }}
          promote-tags: ${{ steps.meta.outputs.tags }}
          dockerhub-user: ${{ secrets.DOCKER_SCOUT_USER }}
          dockerhub-password: ${{ secrets.DOCKER_SCOUT_PASSWORD }}
          severities: critical,high

  slack-notifications:
    if: ${{ !startsWith(github.ref, 'refs/tags/') && github.event_name != 'workflow_dispatch' }}
    needs: [ build ]
    runs-on: ubuntu-24.04
    steps:
      - name: Slack notification
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
        uses: Ilshidur/action-slack@2.0.2
        with:
          args: |
            :done: *${{ github.repository }}* Success building docker image from ${{ github.ref_type }} _${{ github.ref_name }}_ (${{ github.actor }}) :sparkling_heart: ```${{ needs.build.outputs.tags }}```